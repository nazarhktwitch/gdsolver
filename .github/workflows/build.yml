name: Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write
  actions: write

jobs:
  windows:
    name: Windows (GD 2.2091)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install the Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Set up Geode profile
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'gd'
          New-Item -ItemType Directory -Force $dir | Out-Null
          New-Item -ItemType File -Force `
            (Join-Path $dir 'GeometryDash.exe') | Out-Null
          geode profile add --name GithubActions `
            (Join-Path $dir 'GeometryDash.exe') win

      - name: Install Ninja
        run: python -m pip install ninja

      - name: Look up bindings commit
        id: bindings
        shell: pwsh
        env:
          REPO: ${{ vars.GDSOLVER_BINDINGS_REPO || 'https://github.com/gdsolver/geode-bindings' }}
          REF: ${{ vars.GDSOLVER_BINDINGS_REF || '2.209b-on-upstream' }}
        run: |
          if (-not $env:REPO -or -not $env:REF) {
            throw "Set GDSOLVER_BINDINGS_REPO and GDSOLVER_BINDINGS_REF."
          }

          if ($env:REF -match '^[0-9a-f]{40}$') {
            $sha = $env:REF
          } else {
            $sha = (git ls-remote $env:REPO `
              "refs/heads/$env:REF" `
              "refs/tags/$env:REF" `
              "refs/tags/$env:REF^{}" |
              Select-Object -Last 1) -replace '\s.*$', ''
          }

          if (-not $sha) {
            throw "Could not resolve bindings ref: $env:REF"
          }

          "commit=$sha" >> $env:GITHUB_OUTPUT

      - name: Restore Codegen cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/codegen-cache
          key: codegen-${{ runner.os }}-clang-${{ steps.bindings.outputs.commit }}-22091-v1

      - name: Build Windows package
        shell: pwsh
        env:
          GDSOLVER_BINDINGS_REPO: ${{ vars.GDSOLVER_BINDINGS_REPO || 'https://github.com/gdsolver/geode-bindings' }}
          GDSOLVER_BINDINGS_REF: ${{ vars.GDSOLVER_BINDINGS_REF || '2.209b-on-upstream' }}
        run: |
          ./scripts/ci-build-2209.ps1 `
            -Work "$env:RUNNER_TEMP/ci-work" `
            -Out "$env:GITHUB_WORKSPACE/output" `
            -CodegenCache "$env:RUNNER_TEMP/codegen-cache"

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: output/*.geode
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android64 (GD 2.2091, experimental)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Build Android package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          bindings-ref: ${{ vars.GDSOLVER_ANDROID_BINDINGS_REF || '2.209b-on-upstream' }}
          configure-args: >-
            -DGEODE_GD_VERSION=2.2091
            -DGEODE_COMP_GD_VERSION=22091
            -DGDSOLVER_BUILD_DP=OFF
            -DCMAKE_CXX_FLAGS=-ferror-limit=0

      - name: Upload Android package
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: android-package
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 1

  package:
    name: Combine packages
    needs: [windows, android]
    if: >-
      always() &&
      needs.windows.result == 'success' &&
      (needs.android.result == 'success' ||
       needs.android.result == 'skipped' ||
       needs.android.result == 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          path: packages
          merge-multiple: true

      - name: Check packages
        shell: bash
        run: |
          shopt -s nullglob
          files=(packages/*.geode)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .geode packages found."
            exit 1
          fi

          printf 'Found packages:\n'
          printf ' - %s\n' "${files[@]}"

      - name: Upload combined package
        uses: actions/upload-artifact@v7
        with:
          name: geode-package
          path: packages/*.geode
          if-no-files-found: error

      - name: Attach packages to full release
        if: github.event_name == 'release' && !github.event.release.prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" packages/*.geode --clobber

      - name: Delete intermediate artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          for name in windows-package android-package; do
            gh api "repos/$REPOSITORY/actions/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"$name\") | .id" |
            while read -r id; do
              [ -n "$id" ] || continue
              gh api --method DELETE \
                "repos/$REPOSITORY/actions/artifacts/$id" || true
            done
          done

